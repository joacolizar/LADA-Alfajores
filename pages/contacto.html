<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/styles.css">
    <title>Lada</title>
</head>
<body>
     <header>
         <div class="container header-inner">

            <div class="div-logo">
                <a class="logo" href="../index.html">
                    <img src="../img/LOGO-LADA.png" alt="imagen logo">
                </a>
            </div>

            <nav class="header-nav">
                <ul>
                    <li><a href="../index.html">INICIO</a></li>
                    <li><a href="./carrito.html">CARRITO</a></li>
                    <li><a href="./contacto.html">CONTACTO</a></li>
                </ul>
            </nav>

        </div>

    </header>


    <div class="container banner-relleno">

        <img src="../img/IMAGEN-HEADER-CONTACTO2.jpg" alt="Foto produccion de alfajores">

    </div>


    <main class="container">

        <h1 class="titulo-home text-secondary">
            CONTACTO
        </h1>

        <p class="parrafo">
            Si tenés alguna consulta, no dudes en contactarnos.
        </p>


        <section class="seccion-contacto"> 
             <h2 class="titulo-productos text-secondary">CONTACTANOS</h2> 
             <form class="formulario-contacto"> 
                 <div class="campo-formulario"> 
                     <label for="nombre">Nombre completo</label> 
                     <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre"> 
                 </div> 

                 <div class="campo-formulario"> 
                     <label for="apellido">Apellido</label> 
                     <input type="text" id="apellido" name="apellido" placeholder="Ingresá tu apellido"> 
                 </div> 

                 <div class="campo-formulario"> 
                     <label for="email">Mail</label> 
                     <input type="email" id="email" name="email" placeholder="Ingresá tu mail"> 
                 </div>

                 <div class="campo-formulario"> 
                     <label for="mensaje">Mensaje</label> 
                     <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribí tu consulta, reclamo o mensaje"></textarea> 
                 </div> 
                 <button type="button" class="btn bg-secondary text-dark"> ENVIAR </button> 
             </form> 
        </section>
    </main>

    <footer class="container">
        <p>Sitio realizado por joaquin para TalentoTech</p>
        <p>© 2026 LADA - Todos los derechos reservados</p>
    </footer>

</body>

</html>
</body>
</html>
